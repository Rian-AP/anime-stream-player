<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Stream Player</title>
  <!-- HLS.js for browser support on PC and Android, native Safari on iPhone -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #151821;
      --accent: #ff4757;
      --accent-hover: #ff6b81;
      --text: #f1f2f6;
      --subtext: #8e94a5;
      --border: #242938;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0 10px 0;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 19px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }
    .search-box {
      display: flex;
      gap: 8px;
    }
    input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      flex: 1;
      transition: border 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button:active { opacity: 0.85; }

    /* Search results dropdown / grid */
    .search-results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 380px;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .anime-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border-radius: 8px;
      overflow: hidden;
      background: #1c202d;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .anime-card:hover, .anime-card.selected {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .anime-card img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      background: #000;
    }
    .anime-card-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .anime-card-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .anime-card-meta {
      font-size: 11px;
      color: var(--subtext);
    }

    /* Video player box */
    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0,0,0,0.6);
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Episodes and dubbing section */
    .details-panel {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid var(--border);
    }
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .episodes-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }
    .episodes-bar::-webkit-scrollbar { height: 6px; }
    .episodes-bar::-webkit-scrollbar-thumb { background: #2f3542; border-radius: 3px; }
    .ep-btn {
      background: #1c202d;
      border: 1px solid var(--border);
      color: var(--text);
      min-width: 44px;
      height: 38px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 0 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .ep-btn:hover, .ep-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Streams grid */
    .streams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .stream-card {
      background: #1c202d;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stream-card:hover, .stream-card.active {
      border-color: var(--accent);
      background: #252b3d;
    }
    .stream-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background: rgba(255, 71, 87, 0.2);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .stream-meta {
      font-size: 12px;
      color: var(--subtext);
    }
    .stats-bar {
      font-size: 12px;
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>⚡ Anime Edge Player</h1>
    <span style="font-size: 12px; color: #2ed573;">Cloudflare Edge 24/7</span>
  </header>

  <!-- Live Search Section -->
  <div class="search-section">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Поиск аниме (например: Клинок, Наруто, Атака титанов)...">
      <button id="searchBtn">Найти</button>
    </div>
    <div class="search-results" id="searchResults" style="display: none;"></div>
  </div>

  <!-- Main Video Player -->
  <div class="player-box">
    <video id="videoPlayer" controls playsinline></video>
  </div>

  <!-- Episodes & Dubs Control -->
  <div class="details-panel">
    <div>
      <div class="section-title" id="nowPlayingTitle">Выберите аниме или серию</div>
      <div class="episodes-bar" id="episodesBar" style="margin-top: 8px;"></div>
    </div>

    <div>
      <div class="stats-bar" style="margin-bottom: 8px;">
        <span class="section-title">Доступные озвучки и плееры</span>
        <span id="loadTime"></span>
      </div>
      <div class="streams-grid" id="streamsGrid"></div>
    </div>
  </div>
</div>

<script>
  const video = document.getElementById('videoPlayer');
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const searchResults = document.getElementById('searchResults');
  const nowPlayingTitle = document.getElementById('nowPlayingTitle');
  const episodesBar = document.getElementById('episodesBar');
  const streamsGrid = document.getElementById('streamsGrid');
  const loadTime = document.getElementById('loadTime');

  let currentAnime = { id: 2, title: '5 сантиметров в секунду' };
  let currentEpisode = 1;
  let currentHls = null;
  let searchTimeout = null;

  // 1. Live Search
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => doSearch(searchInput.value), 350);
  });
  searchBtn.addEventListener('click', () => doSearch(searchInput.value));

  async function doSearch(query) {
    const q = (query || '').trim();
    if (!q || q.length < 2) {
      searchResults.style.display = 'none';
      return;
    }
    searchResults.style.display = 'grid';
    searchResults.innerHTML = '<div style="color: var(--subtext); padding: 10px;">Ищем...</div>';

    try {
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const data = await res.json();
      const items = data.results || [];

      if (items.length === 0) {
        searchResults.innerHTML = '<div style="color: var(--subtext); padding: 10px;">Ничего не найдено</div>';
        return;
      }

      searchResults.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'anime-card';
        card.innerHTML = `
          <img src="${item.poster || ''}" alt="${item.title}" loading="lazy">
          <div class="anime-card-info">
            <div class="anime-card-title">${item.title}</div>
            ${item.orig_title ? `<div class="anime-card-meta" style="color: #a4b0be; font-size: 10px;">${item.orig_title}</div>` : ''}
            <div class="anime-card-meta">${item.year || ''} • ★ ${item.rating || '-'}</div>
          </div>
        `;
        card.onclick = () => {
          searchResults.style.display = 'none';
          searchInput.value = item.title;
          selectAnime(item.anime_id, item.title);
        };
        searchResults.appendChild(card);
      });
    } catch (e) {
      searchResults.innerHTML = `<div style="color: #ff6b81; padding: 10px;">Ошибка: ${e.message}</div>`;
    }
  }

  // 2. Select Anime & Fetch Episodes
  async function selectAnime(animeId, title) {
    currentAnime = { id: animeId, title };
    nowPlayingTitle.innerText = `${title} — Загрузка серий...`;
    episodesBar.innerHTML = '';
    streamsGrid.innerHTML = '';

    try {
      const res = await fetch(`/api/episodes?anime_id=${animeId}`);
      const data = await res.json();
      const episodes = data.episodes || [1];

      nowPlayingTitle.innerText = `${title} (${episodes.length} серий)`;
      episodesBar.innerHTML = '';

      episodes.forEach((ep, idx) => {
        const btn = document.createElement('button');
        btn.className = `ep-btn ${idx === 0 ? 'active' : ''}`;
        btn.innerText = ep;
        btn.onclick = () => {
          document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentEpisode = ep;
          loadStreams(animeId, ep);
        };
        episodesBar.appendChild(btn);
      });

      currentEpisode = episodes[0] || 1;
      loadStreams(animeId, currentEpisode);
    } catch (err) {
      nowPlayingTitle.innerText = `${title} — Ошибка загрузки серий`;
    }
  }

  // 3. Load Streams for Anime + Episode
  async function loadStreams(animeId, episode) {
    streamsGrid.innerHTML = '<div style="color: var(--subtext); padding: 8px;">Опрос плееров Alloha, Kodik, CVH...</div>';
    loadTime.innerText = 'Загрузка...';

    const start = Date.now();
    try {
      const res = await fetch(`/api/stream?anime_id=${animeId}&episode=${episode}`);
      const data = await res.json();
      const elapsed = Date.now() - start;

      loadTime.innerText = `⏱ ${elapsed} мс`;

      if (!data.streams || data.streams.length === 0) {
        streamsGrid.innerHTML = '<div style="color: #ff6b81; padding: 8px;">Плееры для этой серии не найдены</div>';
        return;
      }

      streamsGrid.innerHTML = '';
      data.streams.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = `stream-card ${idx === 0 ? 'active' : ''}`;
        const maxQ = s.qualities ? (s.qualities['1080p'] ? '1080p' : (s.qualities['720p'] ? '720p' : '480p')) : 'HLS';

        card.innerHTML = `
          <div class="stream-header">
            <strong>${s.voice}</strong>
            <span class="badge">${maxQ}</span>
          </div>
          <div class="stream-meta">
            <span>Плеер: ${s.player.toUpperCase()}</span> • <span>${s.time_ms || 0} мс</span>
          </div>
        `;

        card.onclick = () => {
          document.querySelectorAll('.stream-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          playStream(s.hls_url);
        };

        streamsGrid.appendChild(card);
      });

      // Play first stream
      if (data.streams[0]) {
        playStream(data.streams[0].hls_url);
      }
    } catch (err) {
      streamsGrid.innerHTML = `<div style="color: #ff6b81;">Ошибка: ${err.message}</div>`;
      loadTime.innerText = '';
    }
  }

  // 4. Play Stream (PC: Hls.js, iOS Safari: Native HLS)
  function playStream(url) {
    if (!url) return;
    if (currentHls) {
      currentHls.destroy();
      currentHls = null;
    }

    if (Hls.isSupported()) {
      currentHls = new Hls({ enableWorker: true });
      currentHls.loadSource(url);
      currentHls.attachMedia(video);
      currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.addEventListener('loadedmetadata', () => video.play().catch(() => {}));
    }
  }

  // Initial load
  window.addEventListener('DOMContentLoaded', () => {
    selectAnime(2, '5 сантиметров в секунду');
  });
</script>

</body>
</html>
